<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小狐狸 · 说话样片</title><style>
*{box-sizing:border-box}body{margin:0;color:#503b29;font:16px system-ui;background:#ecd5ad url('meadow.png') center/cover fixed;min-height:100svh}main{min-height:100svh;display:flex;align-items:center;flex-direction:column;padding:30px 18px}h1{font:500 26px Georgia,serif;margin:0}header,p,nav{background:#fff8e8df;border-radius:20px;padding:12px 20px;text-align:center}header small{display:block;margin-top:8px}#fox{width:min(78vw,480px);aspect-ratio:1;background-image:url('expressions.png');background-size:300% 200%;background-position:0 0;filter:drop-shadow(0 15px 10px #49301035);margin:auto 0 0}p{max-width:520px;line-height:1.7;margin:12px}nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}button{border:1px solid #bd9565;background:#fff8ec;border-radius:18px;padding:10px 16px;color:inherit;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #80532e}#play{background:#80532e;color:white}footer{font-size:12px;background:#fff8e8dd;border-radius:12px;padding:8px;margin-top:12px;text-align:center}
</style><main><header><h1>麦田里的小狐狸</h1><small>说话外观样片</small></header><div id="fox" role="img" aria-label="水彩狐狸"></div><p id="caption">你看，风经过麦田的时候，麦穗也会轻轻点头。别着急，我在这里，听你慢慢说。</p><nav><button id="play">听狐狸说话</button><button id="stop">停止</button><button id="next">查看下一个表情</button></nav><footer id="status">素材与声音预览 · 当前为声音能量驱动，尚非精准发音口型</footer></main><script>
const fox=document.querySelector('#fox'),status=document.querySelector('#status');let ctx,buffer,source,analyser,raf,frame=0,running=false,last=0,level=0;
function show(n){frame=n;fox.style.backgroundPosition=`${(n%3)*50}% ${Math.floor(n/3)*100}%`;}
function stop(){running=false;cancelAnimationFrame(raf);if(source){source.onended=null;try{source.stop()}catch{}source.disconnect();source=null;}if(analyser){analyser.disconnect();analyser=null}show(0);document.querySelector('#play').disabled=false;}
document.querySelector('#stop').onclick=()=>{stop();status.textContent='已停止 · 点击可以重播'};
document.querySelector('#next').onclick=()=>{const n=(frame+1)%6;stop();show(n);status.textContent=['安静','轻声开口','张口','圆口','微笑','眨眼'][n]};
document.querySelector('#play').onclick=async()=>{stop();document.querySelector('#play').disabled=true;try{ctx??=new AudioContext();await ctx.resume();if(!buffer){const r=await fetch('sample.wav');if(!r.ok)throw Error('audio');buffer=await ctx.decodeAudioData(await r.arrayBuffer())}source=ctx.createBufferSource();source.buffer=buffer;analyser=ctx.createAnalyser();analyser.fftSize=512;source.connect(analyser);analyser.connect(ctx.destination);const values=new Float32Array(512);running=true;last=0;level=0;status.textContent='正在播放外观样片 · 暂用声音能量驱动';source.onended=()=>{stop();show(4);status.textContent='样片结束 · 精准嘴型与角色绑定尚待制作'};source.start();function tick(t){if(!running)return;analyser.getFloatTimeDomainData(values);const rms=Math.sqrt(values.reduce((s,x)=>s+x*x,0)/values.length);level=.5*level+.5*rms;if(t-last>90){show(level<.018?0:level<.065?1:2);last=t}raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)}catch(e){stop();status.textContent='音频加载失败，请重试'}};
window.addEventListener('pagehide',stop);
</script></html>
